#VRML_SIM R2025a utf8
# Static obstacles with deliberately simple collision geometry.
# template language: javascript
PROTO LabObstacle [
  field SFVec3f translation 0 0 0.1
  field SFVec3f size 0.3 0.3 0.2
  field SFString name "obstacle"
  field SFString kind "crate"
  field SFColor color 0.75 0.45 0.2
] {
%< const s = fields.size.value;
   const drum = fields.kind.value === 'drum';
   const crate = fields.kind.value === 'crate';
   const workcell = fields.kind.value === 'workcell'; >%
Solid {
  translation IS translation
  name IS name
  children [
    Shape {
      appearance DEF BODY PBRAppearance {
        baseColor IS color
        roughness 0.73
        metalness 0.08
      }
      geometry %< if (drum) { >% Cylinder {
        radius %<= s.x / 2 - 0.003 >%
        height %<= s.z >%
        subdivision 32
      } %< } else if (workcell) { >% Box { size %<= s.x >% %<= s.y >% %<= s.z - 0.004 >% }
      %< } else { >% Box { size IS size } %< } >%
    }
    %< if (drum) {
         for (const z of [-s.z * 0.32, s.z * 0.32]) { >%
    Pose {
      translation 0 0 %<= z >%
      children [ Shape {
        appearance PBRAppearance { baseColor 0.13 0.21 0.27 roughness 0.5 metalness 0.35 }
        geometry Cylinder { radius %<= s.x / 2 >% height 0.015 subdivision 32 }
      } ]
    }
    %< } } >%
    %< if (crate) { >%
    Pose {
      translation 0 0 %<= s.z / 2 + 0.0005 >%
      children [ Shape {
        appearance DEF TAPE PBRAppearance { baseColor 0.95 0.76 0.40 roughness 1 metalness 0 }
        geometry Box { size %<= s.x >% 0.035 0.001 }
      } ]
    }
    Pose {
      translation 0 0 %<= s.z / 2 + 0.001 >%
      children [ Shape {
        appearance USE TAPE
        geometry Box { size 0.035 %<= s.y >% 0.001 }
      } ]
    }
    %< } else if (workcell) { >%
    Pose {
      translation 0 0 %<= s.z / 2 - 0.008 >%
      children [ Shape {
        appearance PBRAppearance { baseColor 0.73 0.79 0.82 roughness 0.6 metalness 0.25 }
        geometry Box { size %<= s.x >% %<= s.y >% 0.016 }
      } ]
    }
    Pose {
      translation %<= s.x * 0.32 >% %<= s.y * 0.32 >% %<= s.z / 2 + 0.001 >%
      children [ Shape {
        appearance PBRAppearance { baseColor 0.25 0.88 0.61 emissiveColor 0.08 0.25 0.15 metalness 0 roughness 0.5 }
        geometry Cylinder { radius 0.013 height 0.002 subdivision 16 }
      } ]
    }
    %< } else if (!drum) { >%
    Pose {
      translation 0 0 %<= -s.z / 2 + 0.012 >%
      children [ Shape {
        appearance PBRAppearance { baseColor 0.13 0.21 0.27 roughness 0.7 metalness 0.2 }
        geometry Box { size %<= s.x >% %<= s.y >% 0.024 }
      } ]
    }
    %< } >%
  ]
  boundingObject %< if (drum) { >% Cylinder {
    radius %<= s.x / 2 >%
    height %<= s.z >%
  } %< } else { >% Box { size IS size } %< } >%
}
}
