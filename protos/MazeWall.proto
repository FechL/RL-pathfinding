#VRML_SIM R2025a utf8
# template language: javascript
PROTO MazeWall [
  field SFVec3f translation 0 0 0.09
  field SFVec3f size 0.05 0.40 0.18
  field SFString name "maze wall"
] {
Solid {
  translation IS translation
  name IS name
  children [
    Shape {
      appearance PBRAppearance { baseColor 0.78 0.82 0.78 roughness 0.82 }
      geometry Box { size IS size }
    }
    Pose {
      translation 0 0 %<= fields.size.value.z / 2 - 0.009 >%
      children [ Shape {
        appearance PBRAppearance { baseColor 0.12 0.37 0.43 roughness 0.62 metalness 0.06 }
        geometry Box { size %<= fields.size.value.x >% %<= fields.size.value.y >% 0.018 }
      } ]
    }
  ]
  boundingObject Box { size IS size }
}
}
