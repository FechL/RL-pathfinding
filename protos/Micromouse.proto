#VRML_SIM R2025a utf8
# template language: javascript
# Small differential-drive micromouse with four infrared wall sensors and onboard localization.
PROTO Micromouse [
  field SFVec3f    translation        0 0 0
  field SFRotation rotation           0 0 1 0
  field SFString   name               "Micromouse M1"
  field SFString   controller         "<generic>"
  field MFString   controllerArgs     []
  field SFBool     supervisor         TRUE
  field SFBool     synchronization     TRUE
] {
Robot {
  translation IS translation
  rotation IS rotation
  name IS name
  controller IS controller
  controllerArgs IS controllerArgs
  supervisor IS supervisor
  synchronization IS synchronization
  children [
    # Compact chassis and colored top plate.
    Pose {
      translation 0 0 0.052
      children [ Shape {
        appearance PBRAppearance { baseColor 0.12 0.20 0.24 roughness 0.58 metalness 0.14 }
        geometry Box { size 0.094 0.092 0.052 }
      } ]
    }
    Pose {
      translation -0.004 0 0.081
      children [ Shape {
        appearance PBRAppearance { baseColor 0.94 0.43 0.16 roughness 0.48 metalness 0.05 }
        geometry Box { size 0.070 0.073 0.012 }
      } ]
    }
    # Small front sensor bar and status LED.
    Pose {
      translation 0.050 0 0.051
      children [ Shape {
        appearance PBRAppearance { baseColor 0.10 0.12 0.14 roughness 0.5 }
        geometry Box { size 0.012 0.070 0.021 }
      } ]
    }
    Pose {
      translation -0.004 0 0.091
      children [ Shape {
        appearance PBRAppearance { baseColor 0.25 0.95 0.61 emissiveColor 0.06 0.28 0.14 }
        geometry Box { size 0.018 0.028 0.006 }
      } ]
    }
    %< for (const x of [-0.035, 0.035]) { >%
    Pose {
      translation %<= x >% 0 0.012
      children [ Shape {
        appearance PBRAppearance { baseColor 0.20 0.23 0.24 roughness 0.8 }
        geometry Sphere { radius 0.012 }
      } ]
    }
    %< } >%
    # Left and right driven wheels.
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0.052 0.027 }
      device [
        RotationalMotor { name "left wheel motor" maxVelocity 18 maxTorque 0.18 }
        PositionSensor { name "left wheel sensor" }
      ]
      endPoint Solid {
        translation 0 0.052 0.027
        rotation 1 0 0 1.5708
        name "left drive wheel"
        children [ Shape {
          appearance PBRAppearance { baseColor 0.045 0.055 0.06 roughness 0.96 }
          geometry Cylinder { radius 0.027 height 0.012 subdivision 24 }
        } ]
        boundingObject Cylinder { radius 0.027 height 0.012 }
        physics Physics { density -1 mass 0.008 }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0 -0.052 0.027 }
      device [
        RotationalMotor { name "right wheel motor" maxVelocity 18 maxTorque 0.18 }
        PositionSensor { name "right wheel sensor" }
      ]
      endPoint Solid {
        translation 0 -0.052 0.027
        rotation 1 0 0 1.5708
        name "right drive wheel"
        children [ Shape {
          appearance PBRAppearance { baseColor 0.045 0.055 0.06 roughness 0.96 }
          geometry Cylinder { radius 0.027 height 0.012 subdivision 24 }
        } ]
        boundingObject Cylinder { radius 0.027 height 0.012 }
        physics Physics { density -1 mass 0.008 }
      }
    }
    # Infrared distance sensors; exposed as the future RL observation vector.
    DistanceSensor {
      name "front left sensor"
      type "infra-red"
      translation 0.052 0.026 0.055
      rotation 0 0 1 -0.20
      lookupTable [ 0 4095 0, 0.05 2800 0.01, 0.10 1500 0.01, 0.20 450 0.01, 0.40 0 0.01 ]
    }
    DistanceSensor {
      name "front right sensor"
      type "infra-red"
      translation 0.052 -0.026 0.055
      rotation 0 0 1 0.20
      lookupTable [ 0 4095 0, 0.05 2800 0.01, 0.10 1500 0.01, 0.20 450 0.01, 0.40 0 0.01 ]
    }
    DistanceSensor {
      name "left side sensor"
      type "infra-red"
      translation 0 0.053 0.055
      rotation 0 0 1 1.5708
      lookupTable [ 0 4095 0, 0.05 2800 0.01, 0.10 1500 0.01, 0.20 450 0.01, 0.40 0 0.01 ]
    }
    DistanceSensor {
      name "right side sensor"
      type "infra-red"
      translation 0 -0.053 0.055
      rotation 0 0 1 -1.5708
      lookupTable [ 0 4095 0, 0.05 2800 0.01, 0.10 1500 0.01, 0.20 450 0.01, 0.40 0 0.01 ]
    }
    GPS { name "gps" }
    InertialUnit { name "imu" }
  ]
  boundingObject Group {
    children [
      Pose { translation 0 0 0.052 children [ Box { size 0.105 0.105 0.052 } ] }
      Pose { translation -0.035 0 0.012 children [ Sphere { radius 0.012 } ] }
      Pose { translation 0.035 0 0.012 children [ Sphere { radius 0.012 } ] }
    ]
  }
  physics Physics {
    density -1
    mass 0.18
    centerOfMass [ 0 0 0.047 ]
  }
}
}
